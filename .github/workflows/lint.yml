name: Lint HTML & JavaScript

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ESLint
        run: npm install -g eslint

      - name: Lint JavaScript (if any)
        run: |
          if find . -name "*.js" -type f | head -1 | grep -q .; then
            eslint --no-eslintrc --env browser,es2021 --parser-options ecmaVersion:2021 "**/*.js" || true
          else
            echo "No JavaScript files found"
          fi

      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .
          css: false
